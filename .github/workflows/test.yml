name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libgtest-dev
        
    - name: Build tests
      run: |
        make test

    - name: Run lexer tests
      run: |  
        ./test_scripts/lexer.sh